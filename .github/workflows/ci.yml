name: CargoTrace CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.2', '8.3']

    name: P${{ matrix.php }} - Automated Tests

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, pdo, pdo_sqlite, sqlite3, curl, fileinfo, xml
        coverage: xdebug

    - name: Validate Composer Configuration
      run: composer validate --strict

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install Dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Prepare Application Key & Environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Execute Automated Feature & Unit Tests
      run: php vendor/phpunit/phpunit/phpunit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'
